<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>林怡孜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mirza:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: white gallery floor; projects are objects placed in a row (home) or a shop-like grid (works);
   detail opens as a bordered spec panel; name + round glow at top-centre; glow opens the menu. */
:root{
  --bg:#fbfaf8; --fg:#151413; --muted:#6c6862; --line:#151413;
  --blue:#2347e8; --red:#e2402b; --orange:#f0622d; --panel:#ffffff; --soft:#efece6;
  --shadow:rgba(20,18,15,.13);
  /* one spacing rule for every bordered box: content cells and small label boxes */
  --pad-y:20px; --pad-x:24px; --tag-y:12px; --tag-x:16px;
  /* one title size site-wide: Latin at the BETTY._.WHO size, Chinese at the 花藝品牌與訂購網站 size */
  --t-en:clamp(20px,2.4vw,26px);
  /* Mirza has Latin only; Chinese falls back to Noto Sans TC */
  --f-ui:"Mirza","Noto Sans TC",Georgia,serif;
  --f-body:"Mirza","Noto Sans TC",Georgia,serif;
  --f-pixel:"Mirza","Noto Sans TC",Georgia,serif;
  --gx:max(16px, env(safe-area-inset-left, 0px));
  --gy:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131211; --fg:#f1eee8; --muted:#a6a199; --line:#f1eee8;
  --blue:#8299ff; --red:#ff6d55; --orange:#f0622d; --panel:#1a1917; --soft:#23211e; --shadow:rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131211; --fg:#f1eee8; --muted:#a6a199; --line:#f1eee8;
  --blue:#8299ff; --red:#ff6d55; --orange:#f0622d; --panel:#1a1917; --soft:#23211e; --shadow:rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.caps{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.04em;font-weight:600;font-size:13px}

/* ---------- chrome ---------- */
.top{position:fixed;inset:0;z-index:40;pointer-events:none}
/* name + round glow: top-centre on every page; click opens the menu */
.logo{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));translate:-50% -50%;pointer-events:auto;isolation:isolate}
#logoBtn{display:block;padding:22px 6px;cursor:pointer}
body.is-home .logo{top:50%}
/* the name only shows on the works page; elsewhere the glow alone opens the menu */
body:not(.is-home) .logo .name{visibility:hidden}
body:not(.is-home) .logo,body:not(.is-home) #logoBtn{pointer-events:none}
.logo .name{display:flex;gap:.35em;white-space:nowrap;font-family:var(--f-pixel);font-weight:700;font-size:17px;line-height:1.05;letter-spacing:.03em;color:#151413}
/* the glow stays at top-centre on every page; on the works page only the name sits in the middle */
.blob{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));width:170px;height:170px;translate:-50% -50%;z-index:-1;border-radius:50%;pointer-events:auto;cursor:pointer;
  /* 黃丹 OHNI #F05E1C glow: solid core, soft fade */
  background:radial-gradient(circle at 50% 50%, #f05e1c 0 34%, rgba(240,94,28,.55) 48%, transparent 70%);
  filter:blur(6px);transition:width .6s cubic-bezier(.2,.7,.2,1),height .6s cubic-bezier(.2,.7,.2,1)}
body.menu-open .blob{width:620px;height:620px}
/* home: one object per category */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:48px 36px;width:100%;max-width:960px}
.cat{display:grid;justify-items:center;gap:0;text-align:center}
.cat{position:relative}
.cats{align-items:start}
.cat{align-content:start}
.cat .tip{margin:0 0 18px;display:grid;gap:0;justify-items:center;align-content:center;text-align:center;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel);padding:12px 18px}
/* trim the font's extra ascent/descent so text sits in the true middle of the box */
.cat .tip .en{line-height:1;text-box:trim-both cap alphabetic}
/* Chinese line in its own font; no trimming (it would cut the top and bottom of the characters) */
.cat .tip .zh2{font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.5;letter-spacing:.02em;margin-bottom:-3px}
.cat .vis{height:220px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.cat .vis > .pic{filter:drop-shadow(0 14px 12px var(--shadow));transition:transform .35s cubic-bezier(.2,.7,.2,1),filter .35s,opacity .35s}
.cat .vis svg{width:min(160px,100%);height:auto;aspect-ratio:1;max-width:100%}
.cat .pic{position:relative;height:100%;max-width:100%;display:flex;align-items:flex-end;justify-content:center}
.cat .vis img{height:100%;width:auto;max-width:100%;object-fit:contain}
.cat .vis{position:relative}
.cat .idx{position:absolute;top:0;left:-16px;font-family:var(--f-ui);font-size:13px;line-height:1;color:var(--fg);filter:none}
.cat[data-cat="design"] .pic{height:88%}
.cat[data-cat="design"] .vis img{rotate:15deg}
.cat:hover .vis > .pic,.cat:focus-visible .vis > .pic{transform:translateY(-10px) rotate(-3deg)}
.cats:hover .cat:not(:hover) .vis > .pic{filter:blur(2px) drop-shadow(0 14px 12px var(--shadow));opacity:.7}
.cat .en{font-family:var(--f-ui);font-weight:600;text-transform:uppercase;font-size:15px;letter-spacing:.03em}
.cat .zh2{font-size:12.5px;color:var(--muted);max-height:0;opacity:0;overflow:hidden;transition:max-height .25s ease,opacity .2s,margin .25s}
.cat:hover .zh2,.cat:focus-visible .zh2{max-height:3em;opacity:1;margin-top:6px}
.cat-head{display:grid;gap:2px;margin-bottom:52px}

.frag-field{position:relative;width:100%;aspect-ratio:100/52}
/* fixed-height page: fragments sized from the viewport height, index list on the right */
body.frag-page{overflow:hidden;height:100svh}
body.frag-page main{padding-bottom:0}
.frag-view .cat-head{margin-bottom:24px}
/* push fragments + index to the lower part of the screen */
.frag-view{display:flex;flex-direction:column;height:calc(100svh - 190px);padding-bottom:48px}
.frag-view .frag-body{margin-top:auto}
/* fragments left; heading + index stacked on the right, both starting at the top of the fragment field */
.frag-body{display:flex;align-items:flex-start;justify-content:space-between;gap:clamp(56px,12vw,180px)}
/* heading block: back link + title on the left, index on the right starting level with the title */
.frag-view .cat-head{grid-template-columns:minmax(0,1fr) min(400px,40%);column-gap:40px}
.frag-view .cat-head .bk{grid-column:1;grid-row:1}
.frag-view .cat-head h2{grid-column:1;grid-row:2;align-self:start}
.frag-view .cat-head .frag-index{grid-column:2;grid-row:2 / span 2;align-self:start}
.frag-body .frag-field{flex:0 1 auto;width:auto;height:min(calc(100svh - 500px), 30vw);margin-top:24px}
.frag-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.frag-lines line{stroke:color-mix(in srgb, var(--fg) 45%, transparent);stroke-width:1;vector-effect:non-scaling-stroke}
.frag{position:absolute;display:block}
.frag-shape{position:absolute;inset:0;background-color:var(--sand);transition:filter .25s,transform .35s cubic-bezier(.2,.7,.2,1)}
.frag-no{position:absolute;left:-4px;top:-22px;font-family:var(--f-ui);font-size:14px;letter-spacing:.04em;color:var(--fg)}
.frag:hover .frag-shape,.frag.lit .frag-shape,.frag:focus-visible .frag-shape{background-color:#f05e1c;transform:translateY(-4px)}
.frag-index{list-style:none;margin:0;padding:0;font-family:var(--f-ui)}
.frag-index li{border-bottom:1px solid color-mix(in srgb, var(--fg) 55%, transparent)}
/* every row the same: text trimmed to its baseline, so the gap to the rule below is identical
   whether the row mixes Mirza (ETL, iOS) with Chinese or not */
.frag-index button{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;width:100%;padding:12px 0 9px;text-align:right;font-size:13px;letter-spacing:.02em}
.frag-index button span{line-height:1;text-box:trim-both cap alphabetic}
.frag-index button span:first-child{text-align:left;opacity:.7}
.frag-index button:hover,.frag-index button.lit{color:var(--panel);background:color-mix(in srgb, var(--fg) 85%, transparent);padding-inline:6px}
.cat-head .bk{font-family:var(--f-ui);font-weight:600;text-transform:uppercase;font-size:13.5px;justify-self:start;margin-bottom:14px}
.cat-head h2{margin:0;font-family:var(--f-ui);font-weight:700;text-transform:uppercase;font-size:clamp(24px,3vw,32px);letter-spacing:.01em}
.cat-head p{margin:0;color:var(--muted)}
.logo .px{font-family:var(--f-pixel);font-size:24px;line-height:1;letter-spacing:.02em}
.menu{position:absolute;left:50%;top:100%;translate:-50% 0;display:grid;justify-items:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .25s}
.menu button,.menu a{text-decoration:none;font-family:var(--f-ui);text-transform:uppercase;font-size:16px;letter-spacing:.03em;text-align:left;color:#151413}
.menu button:hover,.menu a:hover{text-decoration:underline}
body.menu-open .menu{opacity:1;pointer-events:auto;transition-delay:.15s}
/* blur the children, not main: a filter on an ancestor would pull the fixed works-page objects out of place */
body.menu-open main{opacity:.55;pointer-events:none}

main{padding-block:190px 140px;max-width:1280px;margin:0 auto;transition:filter .4s,opacity .4s}
.view{animation:fade .45s ease both}
/* opacity only: a transform here would trap the fixed-position objects on the works page */
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- home ---------- */
.home .cats{position:fixed;left:max(28px, env(safe-area-inset-left,0px));right:max(28px, env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:auto;max-width:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;justify-items:center;gap:24px}
.home .cat .vis{height:170px;width:100%;justify-content:center}
.home{display:grid;gap:56px;justify-items:center;padding-top:4vh}
.thesis{max-width:34em;text-align:center;display:grid;gap:10px}
.thesis h1{margin:0;font-family:var(--f-body);font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.45;text-wrap:balance;letter-spacing:.02em}
.thesis p{margin:0;color:var(--muted);font-size:14px}
.thesis .path{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.thesis .path span{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px clamp(4px,1.4vw,22px);width:100%}
.obj{width:118px;display:grid;justify-items:center;gap:6px;position:relative}
.obj svg{width:118px;height:118px;transition:transform .35s cubic-bezier(.2,.7,.2,1),filter .35s;filter:drop-shadow(0 10px 8px var(--shadow))}
.obj:hover svg,.obj:focus-visible svg{transform:translateY(-8px) rotate(-3deg)}
.obj .lbl{font-family:var(--f-ui);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;opacity:0;transition:opacity .2s;white-space:nowrap}
.obj:hover .lbl,.obj:focus-visible .lbl{opacity:1}
.row:hover .obj:not(:hover) svg{filter:blur(2px) drop-shadow(0 10px 8px var(--shadow));opacity:.7}
.hint{font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

/* ---------- works grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{display:grid;justify-items:start;align-content:start;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);padding:20px 22px;min-height:132px;transition:transform .25s}
.card:hover{transform:translateY(-3px)}
.card svg{width:min(190px,100%);height:auto;aspect-ratio:1;max-width:100%;filter:drop-shadow(0 12px 10px var(--shadow));transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.card:hover svg{transform:translateY(-8px)}
.card .t{font-family:var(--f-body);font-weight:700;font-size:15px;line-height:1.4}
.card .m{font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:48px}
.filters button{border:1px solid var(--line);padding:6px 14px;font-family:var(--f-ui);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* ---------- detail ---------- */
/* Design Management box and project pages (Brand, Research) share one width */
:root{--box-w:950px}
.detail{max-width:var(--box-w);margin:0 auto}
.view.about:has(.dm-box){max-width:var(--box-w)}
.pn{display:flex;justify-content:space-between;gap:12px}
.pn button{font-family:var(--f-ui);font-weight:600;text-transform:uppercase;font-size:13px}
.sub-h{margin:22px 0 8px;font-size:14px}
.prose > .sub-h:first-child{margin-top:0}
.stage{position:sticky;top:170px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.stage svg{width:100%;max-width:380px;height:auto;aspect-ratio:1;justify-self:center;filter:drop-shadow(0 20px 16px var(--shadow))}
.stage button{font-size:34px;line-height:1;font-family:var(--f-ui);padding:8px}
.spec{border:1px solid var(--line);background:var(--panel);min-width:0}
.spec > *{border-bottom:1px solid var(--line);padding:16px 20px}
.spec > *:last-child{border-bottom:0}
.spec .back{font-family:var(--f-ui);font-weight:600;text-transform:uppercase;font-size:14px;display:block;width:100%;text-align:left}
.spec h2{margin:0;font-family:var(--f-body);font-weight:700;font-size:clamp(20px,2.4vw,26px);line-height:1.35;text-wrap:balance}
.spec h2 small{display:block;font-family:var(--f-ui);font-weight:500;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.cells{display:grid;grid-template-columns:1fr 1fr;padding:0!important}
.cells.one{grid-template-columns:1fr}
.spec h2 .ttl-zh{font-size:.72em;font-weight:700}
.cells > div{padding:12px 20px;min-width:0}
.cells > div + div{border-left:1px solid var(--line)}
/* field labels (技術, 期間 …) match the section headings */
.cells .k{font-family:var(--f-ui);font-size:14px;font-weight:700;letter-spacing:normal;text-transform:uppercase;margin-bottom:4px}
.cells .v{font-size:15px}
.cells .v.shade{background:var(--soft)}
.prose p{margin:0 0 10px}
.prose p:last-child{margin:0}
.prose ul{margin:0;padding-left:1.1em}
.prose li{margin:2px 0}
.prose .fig{margin:14px 0 0}
.prose .fig img{display:block;width:100%;height:auto;border:1px solid var(--line);background:#fff}
.prose .fig figcaption{margin-top:6px;font-size:12.5px;color:var(--muted)}
/* flow diagrams (Betty) */
.flow{display:grid;gap:10px;margin:14px 0 6px}
.flow-row{display:block}
.flow-k{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
/* box columns share one width across every flow on the page (set by alignFlows), so boxes line up vertically;
   boxes in a row stretch to the same height, so they line up horizontally */
.flow-line{display:grid;grid-auto-flow:column;grid-auto-columns:max-content;justify-content:start;align-items:stretch}
.flow-line .arw{width:24px;text-align:center;padding:0}
/* arrows drawn with CSS so the shaft sits exactly on the box's horizontal centre line (a text "→" glyph sits off-centre) */
.flow .arw{position:relative;align-self:stretch;font-size:0;color:transparent}
.flow .arw::before{content:"";position:absolute;left:5px;right:7px;top:50%;height:1px;margin-top:-.5px;background:var(--muted)}
.flow .arw::after{content:"";position:absolute;right:4px;top:50%;width:0;height:0;margin-top:-4px;border-left:6px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent}
/* when a flow does not fit on one line it wraps; the arrow at the break is drawn as an elbow down to the next line */
.flow-line{position:relative;min-width:0;max-width:100%}
.flow,.flow-row{min-width:0}
.flow-line.wrap{display:flex;flex-wrap:wrap;row-gap:34px;align-items:stretch}
.flow-line.wrap .arw.brk{visibility:hidden}
.flow-bend{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.flow-bend path{fill:none;stroke:var(--muted);stroke-width:1}
.flow-bend polygon{fill:var(--muted)}
/* boxes size to their text (one line each), text centred in the box */
.flow .node{flex:0 0 auto;border:1px solid var(--line);background:transparent;padding:14px 12px;display:grid;place-items:center;text-align:center;font-size:13px;line-height:1;white-space:nowrap}
/* one label per box, trimmed to cap height / baseline so it sits on the box's exact centre line */
.flow .node b{font-weight:400;line-height:1;text-box:trim-both cap alphabetic}
/* first step continues from the website flow above */
.flow .node.from-web{border-style:dashed;background:transparent}
.flow .node span{font-size:11.5px;color:var(--muted)}
.flow .arw{align-self:center;font-style:normal;font-family:var(--f-ui);color:var(--muted);padding:0 2px}
@media (max-width:640px){
  .flow-line{display:flex;flex-direction:column;align-items:stretch}
  .flow-line .arw{width:auto;text-align:left}
  .flow .arw{transform:none;align-self:center;margin-left:0;width:24px;height:20px}
  .flow .arw::before{left:50%;right:auto;top:3px;bottom:7px;width:1px;height:auto;margin:0 0 0 -.5px}
  .flow .arw::after{left:50%;right:auto;top:auto;bottom:2px;margin:0 0 0 -4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--muted);border-bottom:0}
}
.prose code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--soft);padding:1px 5px}
.sec-k{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* chip text sits in the exact middle: Chinese font with even metrics, flex-centred, equal padding */
.chip{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);padding:5px 10px;font-family:var(--f-body);font-size:12.5px;line-height:1.2}
.chip.job{border-color:var(--blue);color:var(--blue)}
.links a{font-family:var(--f-ui);font-weight:600;text-transform:uppercase;font-size:13.5px;text-decoration:underline;margin-right:18px;display:inline-block}
.note{color:var(--muted);font-size:13px}

/* ---------- skills ---------- */
.skills h2,.sh{margin:0 0 6px;font-family:var(--f-body);font-weight:700;font-size:clamp(20px,2.4vw,26px)}
.skills .intro{color:var(--muted);max-width:44em;margin:0 0 32px}
.mx-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
.mx{width:100%;border-collapse:collapse;min-width:820px}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top}
.mx thead th{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.mx thead th + th,.mx td + td{border-left:1px solid var(--line)}
.mx td.c{text-align:center;width:84px}
.mx tbody tr{cursor:pointer}
.mx .sk{font-weight:700;font-size:14.5px}
.mx .jb{font-family:var(--f-ui);font-size:12px;color:var(--blue);letter-spacing:.03em;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border:1.5px solid var(--fg);vertical-align:middle}
.dot.full{background:var(--fg)}
.mx tr.ev td{font-size:13.5px}
.mx tr.ev ul{margin:0;padding-left:1.1em}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .dot{margin-right:6px}

/* ---------- about page ---------- */
main:has(.about){padding-bottom:48px}
.about{min-height:calc(100vh - 238px);display:flex;flex-direction:column;justify-content:flex-end;max-width:1080px;margin:0 auto}
/* one bordered box: intro on the left, details on the right; sits low on the page */
.about-box{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.about-box > *{border-bottom:0!important;padding:0!important;min-width:0}
.about-box .lede{padding:28px 32px!important;border-right:1px solid var(--line)}
.about-box .info > div{padding:16px 20px;border-bottom:1px solid var(--line)}
.about-box .info > div:last-child{border-bottom:0}
.dm-top{margin-bottom:16px}
.dm-box{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr)}
.dm-box > *{padding:0!important;min-width:0}
.dm-head{grid-column:1/-1;padding:26px 32px!important}
.dm-head h2{margin:0 0 4px;font-family:var(--f-ui);font-weight:700;text-transform:uppercase;font-size:clamp(24px,3vw,32px)}
.about .dm-head h3{margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.dm-meta{padding:24px 28px!important;border-right:1px solid var(--line);display:grid;gap:12px;align-content:start}
.dm-meta h4{margin:0;font-size:17px;line-height:1.45;text-wrap:balance}
.dm-org{margin:-4px 0 2px;font-size:14px}
.dm-block{display:grid;gap:12px}
/* divider runs edge to edge across the cell: pull out past the 28px cell padding */
.dm-block + .dm-block{margin:0 calc(-1 * var(--pad-x));padding:var(--pad-y) var(--pad-x) 0;border-top:1px solid var(--line)}
.dm-block ul{margin:0}
.dm-body > .dm-tags{padding-top:4px}
.dm-block h5{margin:0;font-size:15px}
.dm-block .prose p,.dm-block p{margin:0}
.dm-meta > div{font-size:14px}
.dm-meta .sec-k{margin-bottom:2px}
.dm-body{padding:24px 28px!important;display:grid;gap:16px;align-content:start}
.dm-box > *:nth-last-child(-n+2){border-bottom:0!important}
.about h2{margin:0 0 6px;font-family:var(--f-ui);font-weight:700;text-transform:uppercase;font-size:clamp(24px,3vw,32px)}
.about h3{margin:0 0 18px;font-family:var(--f-ui);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.about .lede p{margin:0 0 14px;max-width:34em}
.about .lede p:last-child{margin-bottom:0}
.about .info{font-size:14px}
.about .info a{overflow-wrap:anywhere}
/* tools grouped by type: group name in muted text, list below */
.about .tools{margin:0;display:block}
.about .tools dt,.about .tools dd{display:block;margin:0}
.about .tools dd{margin-top:2px}
.about .tools dt{font-size:var(--body);font-weight:700}
.about .tools dt:not(:first-child){margin-top:10px}
.about .tools dd{margin:0}
/* ---------- project pop-up (AI / DATA) ---------- */
.pmodal{width:min(860px,100%);border:1px solid var(--line);background:var(--panel);max-height:100%;overflow:auto;overscroll-behavior:contain}
.pmodal .spec{border:0}
.pmodal .phead{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:var(--panel);z-index:1}
.pmodal .phead button{font-family:var(--f-ui);font-weight:600;text-transform:uppercase;font-size:14px}
.pmodal .phead .x{font-size:26px;line-height:1;font-weight:400}
/* ---------- modal base ---------- */
.modal-bg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:90px max(16px, env(safe-area-inset-right,0px)) 90px max(16px, env(safe-area-inset-left,0px));
  background:color-mix(in srgb, var(--bg) 40%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal{width:min(720px,100%);max-height:100%;overflow:auto;border:1px solid var(--line);background:var(--panel)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.modal header b{font-family:var(--f-ui);text-transform:uppercase;font-size:15px;letter-spacing:.02em}
.modal header button{font-size:26px;line-height:1}
.modal .body{padding:28px clamp(20px,6vw,64px) 36px;display:grid;gap:18px}
.modal .body svg{width:96px;height:96px;justify-self:center}
.modal h3{margin:0;font-family:var(--f-ui);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.modal p{margin:0}
.modal dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.modal dt{font-family:var(--f-ui);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.05em;padding-top:3px}
.modal dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);padding:0 8px;margin-left:8px;font-family:var(--f-ui);font-size:11.5px;text-transform:uppercase}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .detail{grid-template-columns:1fr;gap:12px}
  .stage{position:static}
  .about{min-height:0}
  .about-box{grid-template-columns:1fr}
  .frag-body{flex-direction:column;align-items:stretch;gap:20px}

}

  .top{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

  .home .cat .vis{height:96px;min-width:0}

  .cat .zh2{font-size:11px}
  .cat .tip{margin-bottom:10px;padding:9px 12px}
  .cat .vis{height:150px}
  .cat .vis svg{width:110px}
  main{padding-block:130px 130px}
  .obj{width:92px}.obj svg{width:92px;height:92px}
  .obj .lbl{opacity:1;font-size:10px;white-space:normal;text-align:center;line-height:1.3}
  .row:hover .obj:not(:hover) svg{filter:drop-shadow(0 10px 8px var(--shadow));opacity:1}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 14px}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ===== AI / DATA slide pop-up ===== */
.pmodal .phead{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px}
.pmodal .phead .ptitle{margin:0;font-family:var(--f-ui);font-weight:700;line-height:1.35}
.pmodal .pstep{font-size:var(--body);color:var(--muted);white-space:nowrap}
.pmodal .slide.fwd{animation:slideIn .28s ease both}
.pmodal .slide.back{animation:slideBack .28s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.pmodal .spec > .slide{padding:0!important}
.pmodal .slide > *{border-bottom:1px solid var(--line);padding:var(--pad-y) var(--pad-x)!important}
.pmodal .slide > .cells{padding:0!important}
.pmodal .slide > .psub{padding-top:12px!important;padding-bottom:12px!important}
.pmodal .slide > .psub:has(+ .lead){border-bottom:0}
.pmodal .slide > .psub + .lead{padding-top:0!important}
/* fixed pop-up height so the frame doesn't jump between slides; long slides scroll inside */
.modal-bg:has(.pmodal){align-items:center}
.pmodal:has(.slide){height:min(760px,100%);display:flex;flex-direction:column}
.pmodal:has(.slide) > .spec{display:flex;flex-direction:column;min-height:100%}
.pmodal:has(.slide) .slide{flex:1 0 auto}
/* ‹ › stay visible at the bottom of the pop-up while a long slide scrolls */
.pmodal:has(.slide) .pn{position:sticky;bottom:0;background:var(--panel);z-index:1}
.pmodal .slide > *:last-child{border-bottom:0}
.pmodal .slide > small:first-child{display:none}
.pmodal .sub-h.first{margin-top:0}
.pmodal .sub-h.mini{margin:12px 0 4px}
.pmodal .lead{margin:0;font-weight:400}
.pmodal .psub{margin:0;color:var(--muted);font-family:var(--f-ui);font-size:12.5px!important;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.pmodal .slide > .psub + .lead{border-top:0}
.pmodal .en-sub{margin:2px 0 10px;color:var(--muted);font-family:var(--f-ui);font-size:12.5px!important;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.pmodal .pn{border-top:1px solid var(--line)}
/* architecture diagrams */
.arch-wrap{overflow-x:auto;margin-top:6px}
.arch{display:block;width:100%;height:auto}
.arch .b{fill:none;stroke:var(--line);stroke-width:1}
.arch .g{fill:var(--soft);stroke:none}
.arch .ar{fill:none;stroke:var(--muted);stroke-width:1}
.arch .ah{fill:var(--muted)}
.arch text{fill:var(--fg);font-family:var(--f-body);font-size:14px}
.arch .lbl{font-weight:700;font-size:15px}
.arch .md{font-size:14px}
.arch .sm{fill:var(--muted);font-size:12.5px}
/* ===== unified box spacing (every page) ===== */
.spec > *, .cells > div, .about-box .lede, .about-box .info > div, .dm-head, .dm-meta, .dm-body, .mx th, .mx td{padding:var(--pad-y) var(--pad-x)!important}
.cells{padding:0!important}
.about-box .info{padding:0!important}
.spec > .cells, .about-box > .info{padding:0!important}
.flow .node, .cat .tip, .chip, .bw-sec .flow .node{padding:var(--tag-y) var(--tag-x)!important}
/* ===== unified page titles ===== */
main h2, .pmodal h2{font-size:var(--t-en)!important;line-height:1.35;letter-spacing:normal!important}
main h2 .ttl-zh, .pmodal h2 .ttl-zh{font-size:.72em;font-weight:700}
/* body text: Mirza runs small next to Noto Sans TC, so Latin runs are set a step larger */
.en-up{font-size:1.12em;line-height:inherit;vertical-align:baseline}
.cells .v{line-height:1.6}

/* ===== one text size site-wide: headings / field labels = body size (15px), only bolder ===== */
:root{--body:15px}
main p, main li, main .cells .v, main .about-box .info > div, main .dm-meta > div, main .dm-org, .pmodal p, .pmodal li, .pmodal .cells .v,
main .about-box .info a, main .about-box .info span#mail{font-size:var(--body)!important}
main .sub-h, .pmodal .sub-h, main .cells .k, .pmodal .cells .k, main .sec-k, .pmodal .sec-k,
main .dm-meta h4, main .dm-block h5, main .about h3, main .mx th, main .mx td.sk{
  font-size:var(--body)!important;font-weight:700!important;letter-spacing:normal!important;text-transform:none!important;line-height:1.5}
main .sec-k, .pmodal .sec-k{margin-bottom:4px}
/* only headings are bold — inline <b> inside body text is regular weight */
main .prose p b, main .prose li b, .pmodal .prose p b, .pmodal .prose li b, main .dm-block li b{font-weight:400}
/* subtitles under sub-headings must not get the Latin bump (they are all Latin, already sized) */
.pmodal .en-sub .en-up, .pmodal .psub .en-up{font-size:1em}
main .mx td.jb, main .legend{font-size:var(--body)!important}
/* About cells: trim half-leading at the first and last line so every cell's text sits exactly one padding from its borders */

/* the name is all Chinese: size the line itself at the Chinese title size so its edge trims cleanly */
main .about .about-name h2{font-size:calc(var(--t-en) * .72)!important;line-height:1.35;margin:0!important}
main .about .about-name h2 .ttl-zh{font-size:1em}
.about-box .about-name{grid-column:1 / -1;padding:var(--pad-y) var(--pad-x)!important;border-bottom:1px solid var(--line)!important}
.about-box .lede .sec-k{margin-bottom:12px}
.about-box .about-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
main .about-box .about-name #mail{font-size:calc(var(--body) * 1.12)}
.about-box .lede .sec-k .en-up{line-height:1}
/* an all-English label (GitHub, Email): set the line at the English size so its edge trims cleanly */
main .about-box .info .sec-k:has(> .en-up:only-child){font-size:calc(var(--body) * 1.12)!important}

{ id:"ai1", art:"", cat:"ai", short:"健檢報告與回診解析", title:"AI 健檢報告轉譯與回診時間解析系統", sub:"STANCODE AI LAB · MEDICAL REPORT PROCESSING & NLP SYSTEM", cells:[["期間", "2025–2026"], ["類型", "Generative AI / NLP / Data Engineering"]], cells2:[["技術", "Python · pandas · MongoDB · FastAPI · GPT-4o · Regex · Docker"]], body:"<p>健檢中心的自動化報告處理系統，節省護理師每日閱讀、手寫轉譯的報告的時間。透過資料處理模組整合 MongoDB 醫療資料、透過規則式 NLP 擷取回診時間，於指定節點以 LLM 生成易於理解的健檢說明及輔助擴充未涵蓋的回診時間語意變體。</p><h4 class=\"sub-h\">A｜Data Extraction &amp; Preprocessing</h4><p>使用 Python、pandas 與 MongoDB，進行跨資料表映射、巢狀 JSON 展開、資料清理、去重及階層化整理，建立可供不同任務共用的資料處理流程。</p><h4 class=\"sub-h\">B｜LLM &amp; Prompt Engineering</h4><p>串接 Azure OpenAI GPT-4o，設計醫療文字白話化 Prompt，限制模型不得新增醫療診斷、遺漏原始建議或修改檢查數值與時間。支援繁中、英文、日文及簡體中文，並控制輸出格式與篇幅。</p><h4 class=\"sub-h\">C｜Rule-based NLP &amp; Information Extraction</h4><p>開發 Regex 回診時間解析模組，使用 Unicode NFKC、中文數字轉換及時間單位標準化，處理否定語意、模糊期限、多重追蹤時間及條件式醫囑，輸出可供提醒系統使用的結構化資料。</p><h4 class=\"sub-h\">D｜Technical Evaluation &amp; System Integration</h4><p>評估 Regex 與 LLM 在語意擷取上的準確性、可重現性及運算成本，採用規則式解析處理明確的時間邏輯。透過 FastAPI 封裝報告處理流程，加入並行請求、API 限流錯誤處理及重試機制，並以 Docker 進行環境封裝。</p>", skills:["Prompt Engineering", "LLM Application", "NLP", "Data Pipeline", "Technical Evaluation", "API Integration"], jobs:[], links:[["GitHub", "https://github.com/zzlinislatszy/Medical-Examination-Data-ETL-System"]], arch:"<div class=\"arch-wrap\"><svg class=\"arch\" viewBox=\"0 0 900 470\" role=\"img\" aria-label=\"健檢報告轉譯與回診時間解析系統架構\" style=\"min-width:738px\"><defs><marker id=\"ah-a1\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0 0 L8 4 L0 8 z\" class=\"ah\"/></marker></defs><path class=\"b\" d=\"M4 192 V298 A78 14 0 0 0 160 298 V192\"/><ellipse class=\"b\" cx=\"82\" cy=\"192\" rx=\"78\" ry=\"14\"/><text class=\"lbl\" x=\"82\" y=\"230\" text-anchor=\"middle\" dominant-baseline=\"central\">MongoDB</text><text class=\"sm\" x=\"82\" y=\"258\" text-anchor=\"middle\" dominant-baseline=\"central\">客戶健檢資料欄位</text><text class=\"sm\" x=\"82\" y=\"280\" text-anchor=\"middle\" dominant-baseline=\"central\">健檢項目-分類對照表</text><path class=\"ar\" d=\"M162 245 L184 245\" marker-end=\"url(#ah-a1)\"/><rect class=\"b\" x=\"190\" y=\"16\" width=\"698\" height=\"440\"/><text class=\"lbl\" x=\"876\" y=\"36\" text-anchor=\"end\" dominant-baseline=\"central\">FastAPI · Docker</text><rect class=\"g\" x=\"204\" y=\"130\" width=\"134\" height=\"230\"/><text class=\"lbl\" x=\"216\" y=\"154\" text-anchor=\"start\" dominant-baseline=\"central\">前處理模組</text><rect class=\"b\" x=\"214\" y=\"176\" width=\"114\" height=\"42\"/><text class=\"\" x=\"271.0\" y=\"197.0\" text-anchor=\"middle\" dominant-baseline=\"central\">資料前處理</text><rect class=\"b\" x=\"214\" y=\"282\" width=\"114\" height=\"42\"/><text class=\"\" x=\"271.0\" y=\"303.0\" text-anchor=\"middle\" dominant-baseline=\"central\">文字前處理</text><path class=\"ar\" d=\"M271 218 L271 280\" marker-end=\"url(#ah-a1)\"/><path class=\"ar\" d=\"M338 245 L352 245\"/><path class=\"ar\" d=\"M352 118 L352 368\"/><path class=\"ar\" d=\"M352 118 L380 118\" marker-end=\"url(#ah-a1)\"/><path class=\"ar\" d=\"M352 368 L380 368\" marker-end=\"url(#ah-a1)\"/><rect class=\"g\" x=\"366\" y=\"48\" width=\"508\" height=\"176\"/><text class=\"lbl\" x=\"380\" y=\"72\" text-anchor=\"start\" dominant-baseline=\"central\">健檢報告轉譯</text><rect class=\"b\" x=\"382\" y=\"96\" width=\"136\" height=\"44\"/><text class=\"\" x=\"450.0\" y=\"118.0\" text-anchor=\"middle\" dominant-baseline=\"central\">LLM 報告生成</text><rect class=\"b\" x=\"552\" y=\"96\" width=\"136\" height=\"44\"/><text class=\"\" x=\"620.0\" y=\"118.0\" text-anchor=\"middle\" dominant-baseline=\"central\">自動比對檢核</text><rect class=\"b\" x=\"722\" y=\"96\" width=\"140\" height=\"44\"/><text class=\"\" x=\"792.0\" y=\"118.0\" text-anchor=\"middle\" dominant-baseline=\"central\">健檢總結報告輸出</text><path class=\"ar\" d=\"M518 118 L550 118\" marker-end=\"url(#ah-a1)\"/><path class=\"ar\" d=\"M688 118 L720 118\" marker-end=\"url(#ah-a1)\"/><text class=\"sm\" x=\"382\" y=\"170\" text-anchor=\"start\" dominant-baseline=\"central\">Azure OpenAI · GPT-4o</text><rect class=\"g\" x=\"366\" y=\"240\" width=\"508\" height=\"206\"/><text class=\"lbl\" x=\"380\" y=\"264\" text-anchor=\"start\" dominant-baseline=\"central\">回診時間解析</text><rect class=\"b\" x=\"382\" y=\"342\" width=\"118\" height=\"52\"/><text class=\"\" x=\"441.0\" y=\"359.0\" text-anchor=\"middle\" dominant-baseline=\"central\">回診時間</text><text class=\"\" x=\"441.0\" y=\"377.0\" text-anchor=\"middle\" dominant-baseline=\"central\">關鍵字檢索</text><rect class=\"b\" x=\"528\" y=\"346\" width=\"112\" height=\"44\"/><text class=\"\" x=\"584.0\" y=\"368.0\" text-anchor=\"middle\" dominant-baseline=\"central\">LLM 語意判別</text><rect class=\"b\" x=\"668\" y=\"346\" width=\"96\" height=\"44\"/><text class=\"\" x=\"716.0\" y=\"368.0\" text-anchor=\"middle\" dominant-baseline=\"central\">時間對照表</text><rect class=\"b\" x=\"788\" y=\"326\" width=\"74\" height=\"42\"/><text class=\"\" x=\"825.0\" y=\"347.0\" text-anchor=\"middle\" dominant-baseline=\"central\">LLM 檢核</text><rect class=\"b\" x=\"788\" y=\"368\" width=\"74\" height=\"42\"/><text class=\"\" x=\"825.0\" y=\"389.0\" text-anchor=\"middle\" dominant-baseline=\"central\">人工檢核</text><path class=\"ar\" d=\"M500 368 L526 368\" marker-end=\"url(#ah-a1)\"/><path class=\"ar\" d=\"M640 368 L666 368\" marker-end=\"url(#ah-a1)\"/><path class=\"ar\" d=\"M764 368 L786 368\" marker-end=\"url(#ah-a1)\"/><text class=\"sm\" x=\"528\" y=\"416\" text-anchor=\"start\" dominant-baseline=\"central\">Azure OpenAI · GPT-4o</text></svg></div>", chal:"<h4 class=\"sub-h\">A｜跨資料來源整合與模組化設計</h4><p><b>挑戰：</b>醫療資料分散於多個 MongoDB Collection，包含巢狀 JSON、診斷代碼及檢查項目對照關係，不同任務需要使用相同的原始資料。</p><p><b>設計決策：</b>以 Python、pandas 建立共用 Data Extraction 與 Data Preprocessing 模組，統一完成資料映射、清理及階層化處理，再分別提供 LLM 轉譯與回診時間解析使用，減少重複處理並提高可維護性。</p><h4 class=\"sub-h\">B｜LLM 生成內容的可靠性控制</h4><p><b>挑戰：</b>醫療報告白話化時，需避免模型新增診斷、遺漏重要資訊或修改醫療數值，同時兼顧文字易讀性。</p><p><b>設計決策：</b>使用 GPT-4o，透過 System Prompt 與 User Prompt 分層控制生成行為：</p><ul><li><b>角色與內容約束：</b>將模型設定為健檢報告文字編輯，禁止臆測病情、新增醫療資訊，並要求完整保留原始數值、單位與追蹤時間。</li><li><b>語意與格式控制：</b>將專業術語轉為易懂、客觀的敘述，限制輸出為單段 1–3 句、每項盡量不超過 60 字，不得加入標題或額外解釋。</li><li><b>輸入結構控制：</b>使用固定 User Prompt 模板逐筆帶入原文，要求改寫內容維持原始資訊結構。</li><li><b>生成參數控制：</b>將 temperature 設為 0，降低生成結果的隨機性，提高輸出一致性。</li></ul>" },

{ id:"ai2", art:"", cat:"ai", short:"波士頓房價預測", title:"波士頓房價預測與集成學習模型開發", sub:"BOSTON HOUSING PRICE PREDICTION & ENSEMBLE LEARNING", cells:[["期間", "2025"], ["類型", "Machine Learning / Regression / Ensemble Learning"]], cells2:[["技術", "Python · pandas · scikit-learn · XGBoost · NumPy · Matplotlib"]], lead:"GitHub 專案紀錄 Kaggle 競賽第一名，最佳 RMSE 為 2.94700", body:"<p>學習AI期間，參與 Kaggle Boston Housing 房價預測競賽，利用住宅環境、人口及社會經濟等特徵，建立房價回歸預測模型。</p><p>透過資料前處理、特徵工程及多種機器學習演算法比較，分析不同模型的預測表現與泛化能力，並以加權集成學習整合模型優勢，改善預測誤差。</p><h4 class=\"sub-h\">A｜Data Preprocessing &amp; Feature Engineering</h4><p>使用 pandas 進行資料讀取、特徵與目標變數分離，透過 StandardScaler 進行特徵標準化，並以 PolynomialFeatures 建立二次多項式與交互特徵，捕捉住宅變數間的非線性關係。</p><h4 class=\"sub-h\">B｜Machine Learning Model Development</h4><p>實作 Ridge Regression、Lasso Regression、Support Vector Regression（SVR）、Random Forest 與 XGBoost，評估線性模型、核方法、Bagging 與 Boosting 等不同演算法的預測特性。</p><h4 class=\"sub-h\">C｜Ensemble Learning &amp; Hyperparameter Tuning</h4><p>使用 VotingRegressor 建立五模型加權集成架構，透過調整模型權重、正則化強度、決策樹深度與模型複雜度，研究不同模型組合對預測誤差的影響。</p><h4 class=\"sub-h\">D｜Model Evaluation &amp; Validation</h4><p>使用訓練集與驗證集分割進行模型評估，以 RMSE 衡量預測誤差，觀察訓練與驗證表現差距，辨識過度擬合問題，並產生 Kaggle 測試集預測結果供外部評分。</p>", skills:["Machine Learning", "Feature Engineering", "Ensemble Learning", "Hyperparameter Tuning", "Model Evaluation", "Python"], jobs:[], links:[], arch:"<div class=\"arch-wrap\"><svg class=\"arch\" viewBox=\"0 0 760 584\" role=\"img\" aria-label=\"波士頓房價預測系統架構\" style=\"min-width:623px\"><defs><marker id=\"ah-a2\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0 0 L8 4 L0 8 z\" class=\"ah\"/></marker></defs><text class=\"lbl\" x=\"380.0\" y=\"20\" text-anchor=\"middle\" dominant-baseline=\"central\">Input｜Boston Housing Dataset</text><text class=\"sm\" x=\"380.0\" y=\"42\" text-anchor=\"middle\" dominant-baseline=\"central\">13 個住宅特徵 · 預測目標 medv</text><path class=\"ar\" d=\"M380.0 58 L380.0 80\" marker-end=\"url(#ah-a2)\"/><rect class=\"b\" x=\"20\" y=\"84\" width=\"720\" height=\"58\"/><text class=\"lbl\" x=\"380.0\" y=\"104\" text-anchor=\"middle\" dominant-baseline=\"central\">01｜Data Preparation</text><text class=\"sm\" x=\"380.0\" y=\"124\" text-anchor=\"middle\" dominant-baseline=\"central\">特徵選取 · 移除 ID · Train / Validation Split</text><path class=\"ar\" d=\"M380.0 144 L380.0 166\" marker-end=\"url(#ah-a2)\"/><rect class=\"b\" x=\"20\" y=\"170\" width=\"720\" height=\"58\"/><text class=\"lbl\" x=\"380.0\" y=\"190\" text-anchor=\"middle\" dominant-baseline=\"central\">02｜Feature Engineering</text><text class=\"sm\" x=\"380.0\" y=\"210\" text-anchor=\"middle\" dominant-baseline=\"central\">StandardScaler · PolynomialFeatures (degree=2)</text><path class=\"ar\" d=\"M380.0 230 L380.0 252\" marker-end=\"url(#ah-a2)\"/><rect class=\"b\" x=\"20\" y=\"256\" width=\"720\" height=\"158\"/><text class=\"lbl\" x=\"380.0\" y=\"278\" text-anchor=\"middle\" dominant-baseline=\"central\">03｜Model Training</text><text class=\"md\" x=\"200.0\" y=\"312\" text-anchor=\"middle\" dominant-baseline=\"central\">Ridge / Lasso</text><text class=\"sm\" x=\"200.0\" y=\"332\" text-anchor=\"middle\" dominant-baseline=\"central\">Linear Models</text><text class=\"md\" x=\"560.0\" y=\"312\" text-anchor=\"middle\" dominant-baseline=\"central\">SVR</text><text class=\"sm\" x=\"560.0\" y=\"332\" text-anchor=\"middle\" dominant-baseline=\"central\">Kernel Method</text><text class=\"md\" x=\"200.0\" y=\"368\" text-anchor=\"middle\" dominant-baseline=\"central\">Random Forest</text><text class=\"sm\" x=\"200.0\" y=\"388\" text-anchor=\"middle\" dominant-baseline=\"central\">Bagging Ensemble</text><text class=\"md\" x=\"560.0\" y=\"368\" text-anchor=\"middle\" dominant-baseline=\"central\">XGBoost</text><text class=\"sm\" x=\"560.0\" y=\"388\" text-anchor=\"middle\" dominant-baseline=\"central\">Gradient Boosting</text><path class=\"ar\" d=\"M380.0 416 L380.0 438\" marker-end=\"url(#ah-a2)\"/><rect class=\"b\" x=\"20\" y=\"442\" width=\"720\" height=\"58\"/><text class=\"lbl\" x=\"380.0\" y=\"462\" text-anchor=\"middle\" dominant-baseline=\"central\">04｜Weighted Ensemble</text><text class=\"sm\" x=\"380.0\" y=\"482\" text-anchor=\"middle\" dominant-baseline=\"central\">VotingRegressor · 模型加權組合</text><path class=\"ar\" d=\"M380.0 502 L380.0 524\" marker-end=\"url(#ah-a2)\"/><text class=\"lbl\" x=\"380.0\" y=\"540\" text-anchor=\"middle\" dominant-baseline=\"central\">05｜Evaluation &amp; Prediction</text><text class=\"sm\" x=\"380.0\" y=\"562\" text-anchor=\"middle\" dominant-baseline=\"central\">Train / Validation RMSE · Kaggle Submission</text></svg></div>", chal:"<h4 class=\"sub-h\">A｜非線性特徵建構與模型適配</h4><p><b>挑戰：</b>住宅價格受到多個環境與社會經濟變數影響，部分特徵具有非線性關係，單純線性回歸難以充分捕捉，但增加特徵維度也可能導致過度擬合。</p><p><b>設計決策：</b>針對 Ridge、Lasso 使用二次 PolynomialFeatures 與 StandardScaler；SVR 採用多項式 Kernel，樹模型則保留原始數值特徵。透過不同特徵組合實驗，依驗證表現決定是否保留新增特徵。</p><h4 class=\"sub-h\">B｜模型選型與加權集成策略</h4><p><b>挑戰：</b>各種回歸演算法對資料特性的適應性不同，單一模型難以同時兼顧非線性預測能力與泛化表現。</p><p><b>設計決策：</b>比較線性模型、SVR、Random Forest 與 XGBoost，使用 VotingRegressor 建立加權集成架構。以 XGBoost 作為主要預測模型，結合其他模型的不同預測特性，並透過實驗調整權重，尋找較佳的集成組合。</p><h4 class=\"sub-h\">C｜模型複雜度與過度擬合控制</h4><p><b>挑戰：</b>實驗中曾出現訓練 RMSE 約 0.81、驗證 RMSE 約 3.36 的明顯落差，顯示模型對訓練資料擬合程度較高，泛化能力仍有改善空間。</p><p><b>設計決策：</b>調整 XGBoost 的樹深度、分裂條件及 L1/L2 正則化參數，搭配 Random Forest 剪枝與 Ridge、Lasso 正則化，觀察模型複雜度對預測誤差的影響。</p>" },

{ id:"ai3", art:"", cat:"ai", short:"Veeva CRM 自動化", title:"Veeva CRM 拜訪紀錄自動化系統", sub:"VEEVA CRM WORKFLOW AUTOMATION SYSTEM", cells:[["期間", "2025–2026"], ["類型", "Workflow Automation / iOS Automation / UI Recognition"]], cells2:[["技術", "Python · Appium · XCUITest · WebDriverAgent · Tkinter · Excel"]], body:"<p>開發 iOS 自動化操作工具，節省醫藥業務每日1至2小時在 Veeva CRM 中重複填寫醫師拜訪紀錄（Interaction Report）。</p><p>系統以 Excel 醫師名單及拜訪資訊為輸入，依指定日期區間安排執行任務，透過 Appium 與 XCUITest 控制 iPad 介面，規劃自動完成連續選取欄位的提交流程。</p><p>開發過程亦針對動態行事曆介面，研究結合 UI 元素辨識、座標定位與影像特徵偵測的操作方法。</p><h4 class=\"sub-h\">A｜Task Processing &amp; Workflow Design</h4><p>使用 Python 讀取 Excel 醫師拜訪資料，進行日期格式標準化、區間篩選與任務排序，將業務操作需求拆解為可依序執行的自動化步驟。</p><h4 class=\"sub-h\">B｜iOS UI Automation</h4><p>透過 Appium、XCUITest 與 WebDriverAgent 建立 iOS 裝置控制流程，使用 Accessibility 元素定位、座標點擊、滑動及畫面狀態檢查，實作 Veeva CRM 操作流程。</p><h4 class=\"sub-h\">C｜UI Recognition &amp; Visual Detection</h4><p>針對動態行事曆中難以直接定位的醫師任務卡片，研究以畫面色彩特徵辨識目標區域，再結合 Appium 元素位置資訊進行定位。相關辨識流程另以 iPhone Calendar 原型進行開發與測試。</p><h4 class=\"sub-h\">D｜Modular Architecture &amp; Error Handling</h4><p>將使用者介面、資料前處理、操作流程與通用裝置控制功能拆分為獨立模組，整合執行狀態回報、例外處理及測試模式，改善系統維護與除錯效率。</p>", skills:["Python Automation", "Computer Vision", "UI Automation", "Workflow Design", "System Integration", "Prototyping"], jobs:[], links:[], arch:"<div class=\"arch-wrap\"><svg class=\"arch\" viewBox=\"0 0 760 632\" role=\"img\" aria-label=\"Veeva CRM 拜訪紀錄自動化系統架構\" style=\"min-width:623px\"><defs><marker id=\"ah-a3\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0 0 L8 4 L0 8 z\" class=\"ah\"/></marker></defs><text class=\"lbl\" x=\"380.0\" y=\"20\" text-anchor=\"middle\" dominant-baseline=\"central\">Excel｜拜訪任務資料</text><text class=\"sm\" x=\"380.0\" y=\"42\" text-anchor=\"middle\" dominant-baseline=\"central\">拜訪日期 · 醫師姓名 · 產品 · 產品說明</text><path class=\"ar\" d=\"M380.0 58 L380.0 80\" marker-end=\"url(#ah-a3)\"/><rect class=\"b\" x=\"20\" y=\"84\" width=\"720\" height=\"58\"/><text class=\"lbl\" x=\"380.0\" y=\"104\" text-anchor=\"middle\" dominant-baseline=\"central\">01｜Data Preprocessing</text><text class=\"sm\" x=\"380.0\" y=\"124\" text-anchor=\"middle\" dominant-baseline=\"central\">日期標準化 · 區間篩選 · 任務排序</text><path class=\"ar\" d=\"M380.0 144 L380.0 166\" marker-end=\"url(#ah-a3)\"/><rect class=\"b\" x=\"20\" y=\"170\" width=\"720\" height=\"58\"/><text class=\"lbl\" x=\"380.0\" y=\"190\" text-anchor=\"middle\" dominant-baseline=\"central\">02｜Task Controller</text><text class=\"sm\" x=\"380.0\" y=\"210\" text-anchor=\"middle\" dominant-baseline=\"central\">Tkinter UI · 授權碼與日期輸入 · 狀態回報</text><path class=\"ar\" d=\"M380.0 230 L380.0 252\" marker-end=\"url(#ah-a3)\"/><text class=\"lbl\" x=\"380.0\" y=\"268\" text-anchor=\"middle\" dominant-baseline=\"central\">03｜iOS Automation Engine</text><text class=\"sm\" x=\"380.0\" y=\"290\" text-anchor=\"middle\" dominant-baseline=\"central\">Python · Appium · XCUITest · WebDriverAgent</text><path class=\"ar\" d=\"M380.0 306 L380.0 328\" marker-end=\"url(#ah-a3)\"/><rect class=\"b\" x=\"20.0\" y=\"332\" width=\"354.0\" height=\"130\"/><text class=\"lbl\" x=\"38.0\" y=\"354\" text-anchor=\"start\" dominant-baseline=\"central\">UI Element Detection</text><text class=\"sm\" x=\"38.0\" y=\"376\" text-anchor=\"start\" dominant-baseline=\"central\">Accessibility Tree</text><text class=\"md\" x=\"38.0\" y=\"400\" text-anchor=\"start\" dominant-baseline=\"central\">Button / Cell 辨識</text><text class=\"md\" x=\"38.0\" y=\"422\" text-anchor=\"start\" dominant-baseline=\"central\">元素屬性與座標</text><text class=\"md\" x=\"38.0\" y=\"444\" text-anchor=\"start\" dominant-baseline=\"central\">Tap / Swipe / Scroll</text><rect class=\"b\" x=\"386.0\" y=\"332\" width=\"354.0\" height=\"130\"/><text class=\"lbl\" x=\"404.0\" y=\"354\" text-anchor=\"start\" dominant-baseline=\"central\">Visual Detection POC</text><text class=\"sm\" x=\"404.0\" y=\"376\" text-anchor=\"start\" dominant-baseline=\"central\">Screenshot-based</text><text class=\"md\" x=\"404.0\" y=\"400\" text-anchor=\"start\" dominant-baseline=\"central\">色彩特徵偵測</text><text class=\"md\" x=\"404.0\" y=\"422\" text-anchor=\"start\" dominant-baseline=\"central\">ROI 區域推算</text><text class=\"md\" x=\"404.0\" y=\"444\" text-anchor=\"start\" dominant-baseline=\"central\">候選元素篩選</text><path class=\"ar\" d=\"M380.0 464 L380.0 486\" marker-end=\"url(#ah-a3)\"/><rect class=\"b\" x=\"20\" y=\"490\" width=\"720\" height=\"58\"/><text class=\"lbl\" x=\"380.0\" y=\"510\" text-anchor=\"middle\" dominant-baseline=\"central\">04｜Veeva CRM Interaction Workflow</text><text class=\"sm\" x=\"380.0\" y=\"530\" text-anchor=\"middle\" dominant-baseline=\"central\">My Schedule → Doctor → Edit → Product / Key Message → Media → Submit</text><path class=\"ar\" d=\"M380.0 550 L380.0 572\" marker-end=\"url(#ah-a3)\"/><text class=\"lbl\" x=\"380.0\" y=\"588\" text-anchor=\"middle\" dominant-baseline=\"central\">Execution Status &amp; Error Logs</text><text class=\"sm\" x=\"380.0\" y=\"610\" text-anchor=\"middle\" dominant-baseline=\"central\">執行進度 · 操作紀錄 · 例外回報</text></svg></div>", chal:"<h4 class=\"sub-h\">A｜動態 UI 元素辨識與定位</h4><p><b>挑戰：</b>iOS 行事曆中的醫師任務位置會隨日期、時間及畫面捲動改變，固定座標難以穩定定位，部分畫面元素也缺乏可直接使用的識別屬性。</p><p><b>設計決策：</b>優先使用 XCUITest Accessibility Tree 取得元素類型、名稱及 rect 座標，結合相對座標、日期欄位位置及 ROI 範圍判斷目標位置，降低對固定螢幕座標的依賴。</p><h4 class=\"sub-h\">B｜結合影像特徵與 UI 元素資訊</h4><p><b>挑戰：</b>行事曆中的任務狀態以顏色呈現，但 Accessibility Tree 通常無法直接提供背景色彩，僅使用 UI 元素屬性難以完整辨識目標卡片。</p><p><b>設計決策：</b>在後續測試原型中，研究透過畫面截圖偵測紅色狀態條，依色條位置建立候選 ROI，再與 Appium 擷取的 Button、Cell 等元素位置交叉比對，選擇可能的可點擊容器。</p><h4 class=\"sub-h\">C｜受限測試環境下的原型驗證</h4><p><b>挑戰：</b>Veeva CRM 僅能透過客戶公司的 iPad 登入，無法持續取得實際操作環境，增加介面測試、除錯與系統驗證的困難。</p><p><b>設計決策：</b>將 Appium 裝置控制與 Veeva 專屬業務流程分離，使用自有 iOS 裝置及 Apple Calendar 驗證連線、元素擷取和介面操作。另透過狀態紀錄及例外訊息追蹤錯誤，排查 Appium 連線與 Tkinter 多執行緒問題。</p>" },

{ id:"ai4", art:"", cat:"ai", short:"AI & ML Practice", title:"AI & MACHINE LEARNING PRACTICE", sub:"", cells:[], cells2:[], body:"<h4 class=\"sub-h\">01｜MNIST 手寫數字辨識</h4><p class=\"en-sub\">MNIST HANDWRITTEN DIGIT RECOGNITION</p><p><b>目的：</b>使用 PyTorch 建立深度學習模型，探索影像特徵處理、神經網路訓練與分類推論。</p><h5 class=\"sub-h mini\">核心開發內容</h5><ul><li><b>Data Processing：</b>使用 torchvision 載入 MNIST 資料集，透過 RandomRotation、RandomAutocontrast 進行資料增強，並以 DataLoader 建立 Mini-batch 訓練流程。</li><li><b>Deep Learning：</b>使用 PyTorch nn.Module 建立 LSTM 神經網路，將影像像素序列作為輸入，搭配全連接層完成十類手寫數字分類，另進行 CNN 架構設計練習。</li><li><b>Model Training &amp; Evaluation：</b>使用 CrossEntropyLoss、Adam Optimizer 與 Backpropagation 進行模型訓練，支援 GPU 運算，記錄最高約 93.4% 的驗證準確率。</li></ul><h4 class=\"sub-h\">02｜影評情感分類與詞向量</h4><p class=\"en-sub\">SENTIMENT CLASSIFICATION &amp; WORD EMBEDDINGS</p><p><b>目的：</b>將非結構化文字轉換為數值特徵，建立情感分類模型，並運用預訓練詞向量分析詞彙間的語意關係。</p><h5 class=\"sub-h mini\">核心開發內容</h5><ul><li><b>Text Classification：</b>使用 Word Count、Character N-gram 建立稀疏文字特徵，搭配 Logistic Regression、Sigmoid 與 SGD 實作影評正負向分類模型。</li><li><b>Model Evaluation：</b>比較訓練與驗證誤差，分析文字特徵對分類表現及過度擬合的影響，並建立互動式文字輸入與情感預測功能。</li><li><b>Word Embeddings：</b>使用 Gensim 載入預訓練 GloVe 50 維詞向量，實作 Cosine Similarity、語意相似詞搜尋、詞彙類比運算及 PCA 二維降維視覺化。</li></ul><h4 class=\"sub-h\">03｜Titanic 生還預測</h4><p class=\"en-sub\">TITANIC SURVIVAL PREDICTION</p><p><b>目的：</b>利用乘客特徵預測生還機率，實作經典機器學習分類模型、特徵工程與模型評估。</p><h5 class=\"sub-h mini\">核心開發內容</h5><ul><li><b>Data Preprocessing：</b>使用 pandas、NumPy 處理缺失值、類別編碼、One-Hot Encoding 與特徵標準化。</li><li><b>Model Development：</b>使用 Python 實作 Logistic Regression、Sigmoid、Cross-Entropy Loss 與 SGD 權重更新，並透過 scikit-learn 建立分類模型。</li><li><b>Feature Engineering &amp; Evaluation：</b>使用 PolynomialFeatures 建立多項式與交互特徵，比較不同特徵維度對模型準確率的影響，驗證模型的泛化能力。</li></ul><h4 class=\"sub-h\">TECHNICAL FOUNDATIONS｜機器學習技術基礎</h4><ul><li><b>Mathematical Foundations：</b>Linear / Logistic Regression、Sigmoid、ReLU、MSE、Cross-Entropy Loss。</li><li><b>Optimization &amp; Training：</b>Gradient Descent、SGD、Adam、Forward Propagation、Backpropagation。</li><li><b>Model Evaluation：</b>Train / Validation Split、Accuracy、Loss、Overfitting Analysis。</li><li><b>Development Tools：</b>Python、NumPy、pandas、scikit-learn、PyTorch、Gensim、Matplotlib。</li></ul>", skills:[], jobs:[], links:[] },

  const all = [...p.cells, ...p.cells2].filter(c=>c[0]!=='角色');
  const rows = []; for(let k=0;k<all.length;k+=2) rows.push(all.slice(k,k+2));

      ${p.lead?`<p class="lead">${esc(p.lead)}</p>`:''}

// pop-up window for a project, opened from the AI / DATA page; the page underneath stays put
let lastFocus=null;
// AI / DATA pop-up: each project is a run of slides (basic info → architecture → challenges);
// ‹ › / swipe / arrow keys step through slides, and past the last slide into the next project
const SLIDE_NAMES=['基本資訊','系統架構','技術挑戰與設計決策'];
function projectSlides(p){
  const sl=[{name:SLIDE_NAMES[0], html:specInner(p).replace(/^\s*<h2>[\s\S]*?<\/h2>/, p.sub?`<p class="psub">${esc(p.sub)}</p>`:'')}];
  if(p.arch) sl.push({name:SLIDE_NAMES[1], html:`<div class="slide-body"><h4 class="sub-h first">系統架構</h4>${p.arch}</div>`});
  if(p.chal) sl.push({name:SLIDE_NAMES[2], html:`<div class="slide-body prose"><h4 class="sub-h first">技術挑戰與設計決策</h4>${p.chal}</div>`});
  return sl;
}
function openProject(id, slide=0){
  const p=byId[id]; if(!p) return;
  const sib=inCat(p.cat), i=sib.indexOf(p), num=k=>String(k+1).padStart(2,'0');
  const slides=projectSlides(p); if(slide<0) slide=slides.length-1; slide=Math.min(slide,slides.length-1);
  const prevP=sib[(i-1+sib.length)%sib.length], nextP=sib[(i+1)%sib.length];
  const prev = slide>0 ? {id, s:slide-1, label:slides[slide-1].name} : {id:prevP.id, s:-1, label:`${num(sib.indexOf(prevP))}｜${prevP.short}`};
  const next = slide<slides.length-1 ? {id, s:slide+1, label:slides[slide+1].name} : {id:nextP.id, s:0, label:`${num(sib.indexOf(nextP))}｜${nextP.short}`};
  let wrap=document.getElementById('pmodal');
  if(!wrap){ lastFocus=document.activeElement; wrap=document.createElement('div'); wrap.className='modal-bg'; wrap.id='pmodal'; document.body.appendChild(wrap); bindSwipe(wrap); }
  const dir = wrap.dataset.key ? (wrap.dataset.key < `${String(i).padStart(3,'0')}${slide}` ? 'fwd':'back') : '';
  wrap.dataset.key = `${String(i).padStart(3,'0')}${slide}`;
  wrap.innerHTML=`<div class="pmodal" role="dialog" aria-modal="true" aria-label="${esc(num(i)+'｜'+p.title)}">
    <article class="spec">
      <div class="phead"><h2 class="ptitle">${esc(num(i)+'｜'+p.title)}</h2>
        <span class="pstep">${slides.length>1?`${esc(slides[slide].name)} ${slide+1}/${slides.length}`:''}</span>
        <button class="x" data-close aria-label="關閉">×</button></div>
      <div class="slide ${dir}">${slides[slide].html}</div>
      <div class="pn"><button data-popen="${prev.id}" data-slide="${prev.s}">‹ ${esc(prev.label)}</button><button data-popen="${next.id}" data-slide="${next.s}">${esc(next.label)} ›</button></div>
    </article></div>`;
  wrap.querySelector('.pmodal').scrollTop=0;
  splitTitles(wrap); bumpLatin(wrap);
  wrap.querySelector('[data-close]').focus({preventScroll:true});
}
function stepProject(d){ const b=document.querySelectorAll('#pmodal .pn button')[d>0?1:0]; b?.click(); }
function bindSwipe(el){
  let x0=null,y0=0;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; x0=e.clientX; y0=e.clientY; });
  el.addEventListener('pointerup',e=>{ if(x0===null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) stepProject(dx<0?1:-1); });
}
function closeProject(){ const m=document.getElementById('pmodal'); if(m){ m.remove(); lastFocus?.focus?.(); } }

// give every flow on the page the same box-column widths (widest box per column wins);
// a flow that is too wide for its box wraps, and the arrow at the break becomes an elbow to the next line
function alignFlows(root){
  const lines=[...root.querySelectorAll('.flow-line')]; if(!lines.length) return;
  lines.forEach(l=>{l.style.gridTemplateColumns='';l.classList.remove('wrap');l.querySelectorAll('.arw').forEach(a=>a.classList.remove('brk'));l.querySelector('.flow-bend')?.remove();[...l.querySelectorAll('.node')].forEach(n=>n.style.width='')});
  if(matchMedia('(max-width:640px)').matches) return;
  const w=[];
  lines.forEach(l=>{
    const ns=[...l.querySelectorAll('.node')];
    // every box is as wide as its own label + the shared side padding
    w.length=0; ns.forEach((n,i)=>{w[i]=Math.ceil(n.getBoundingClientRect().width)});
    const need=ns.reduce((t,_,i)=>t+w[i],0)+24*(ns.length-1);
    const avail=l.closest('.flow').getBoundingClientRect().width;
    if(need<=avail){ l.style.gridTemplateColumns=ns.map((_,i)=>w[i]+'px').join(' 24px '); return; }
    // wrap mode
    l.style.gridTemplateColumns=''; l.classList.add('wrap');
    ns.forEach((n,i)=>n.style.width=w[i]+'px');
    const arws=[...l.querySelectorAll('.arw')];
    for(let pass=0;pass<4;pass++){
      let changed=false;
      arws.forEach(a=>{const p=a.previousElementSibling,n=a.nextElementSibling;
        const brk=n.getBoundingClientRect().top>p.getBoundingClientRect().top+4;
        if(brk!==a.classList.contains('brk')){a.classList.toggle('brk',brk);changed=true}});
      if(!changed) break;
    }
    const L=l.getBoundingClientRect(), svgNS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(svgNS,'svg'); svg.setAttribute('class','flow-bend'); svg.setAttribute('width',L.width); svg.setAttribute('height',L.height);
    arws.filter(a=>a.classList.contains('brk')).forEach(a=>{
      const P=a.previousElementSibling.getBoundingClientRect(), N=a.nextElementSibling.getBoundingClientRect();
      const x1=P.left+P.width/2-L.left, y1=P.bottom-L.top, x2=N.left+N.width/2-L.left, y2=N.top-L.top, ym=(y1+y2)/2;
      const path=document.createElementNS(svgNS,'path'); path.setAttribute('d',`M${x1} ${y1} V${ym} H${x2} V${y2-5}`); svg.appendChild(path);
      const head=document.createElementNS(svgNS,'polygon'); head.setAttribute('points',`${x2-4},${y2-6} ${x2+4},${y2-6} ${x2},${y2}`); svg.appendChild(head);
    });
    l.appendChild(svg);
  });
}
addEventListener('resize',()=>alignFlows(document));
document.fonts?.ready.then(()=>alignFlows(document));

/* Equalize the visible gap between the ink of the text and the cell borders.
   Line boxes include font ascent/descent and leading, which differ by font and browser,
   so we measure each glyph's actual ink (canvas actualBoundingBox*) and set padding to match. */
const INK_SEL='.about-box .about-name, .about-box .lede, .about-box .info > div';
const _inkCv=document.createElement('canvas').getContext('2d'), _inkCache=new Map();
function _inkM(font,ch){const k=font+'|'+ch;let m=_inkCache.get(k);if(!m){_inkCv.font=font;const t=_inkCv.measureText(ch);m={fa:t.fontBoundingBoxAscent,a:t.actualBoundingBoxAscent,d:t.actualBoundingBoxDescent};_inkCache.set(k,m);}return m;}
function inkPad(root=document,target=20){
  const cells=[...root.querySelectorAll(INK_SEL)]; if(!cells.length) return;
  _inkCache.clear();
  cells.forEach(c=>{c.style.setProperty('padding-top',target+'px','important');c.style.setProperty('padding-bottom',target+'px','important');});
  cells.forEach(c=>{
    let top=Infinity,bot=-Infinity;
    const w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT);
    while(w.nextNode()){const n=w.currentNode,el=n.parentElement;if(!n.data.trim())continue;
      const cs=getComputedStyle(el);if(cs.visibility==='hidden'||cs.display==='none')continue;
      const font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`,up=cs.textTransform==='uppercase';
      const r=document.createRange();
      for(let i=0;i<n.data.length;i++){let ch=n.data[i];if(/\s/.test(ch))continue;if(up)ch=ch.toUpperCase();
        r.setStart(n,i);r.setEnd(n,i+1);const q=r.getBoundingClientRect();if(!q.height)continue;
        const m=_inkM(font,ch),base=q.top+m.fa;top=Math.min(top,base-m.a);bot=Math.max(bot,base+m.d);}}
    c.querySelectorAll('button').forEach(b=>{const q=b.getBoundingClientRect();top=Math.min(top,q.top);bot=Math.max(bot,q.bottom);});
    if(!isFinite(top))return;
    const C=c.getBoundingClientRect(),cs=getComputedStyle(c);
    const gt=top-C.top-parseFloat(cs.borderTopWidth), gb=C.bottom-parseFloat(cs.borderBottomWidth)-bot;
    c.style.setProperty('padding-top',Math.max(0,target+(target-gt))+'px','important');
    c.style.setProperty('padding-bottom',Math.max(0,target+(target-gb))+'px','important');
  });
}
addEventListener('resize',()=>inkPad(document));
document.fonts?.ready.then(()=>inkPad(document));
document.fonts?.addEventListener?.('loadingdone',()=>inkPad(document));

  document.getElementById('copyMail').onclick=()=>{const t=document.getElementById('mail').textContent;
    (navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>{document.getElementById('copyMail').textContent='Copied'}).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('mail'));const s=getSelection();s.removeAllRanges();s.addRange(r);});};
  requestAnimationFrame(()=>inkPad($app));
}

/* ===================== ROUTING ===================== */
function go(t){ document.body.classList.remove('menu-open'); document.getElementById('logoBtn').setAttribute('aria-expanded','false');
  if(location.hash==='#'+t) route(); else location.hash=t; window.scrollTo({top:0}); }
// in body text, wrap Latin/number runs so they can be set a little larger than the Chinese around them
function bumpLatin(root){
  root.querySelectorAll('main .sub-h, .pmodal .sub-h, main .cells .k, .pmodal .cells .k, main .sec-k, .pmodal .sec-k, main .dm-meta h4, main .dm-block h5, main .about h3, main .mx th, main .mx td, main .legend, main .intro, .pmodal .chip, main .chip, main .prose p, main .prose li, .pmodal .prose p, .pmodal .prose li, main .cells .v, .pmodal .cells .v, main .about-box .lede p, main .about-box .info > div, main .dm-block li, main .dm-block p, main .dm-meta > div, main .dm-org').forEach(el=>{
    if(el.dataset.enUp) return; el.dataset.enUp='1';
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.en-up,.node,.copy,a,code')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{
      const re=/[A-Za-z0-9][A-Za-z0-9 .,%+\-_'’:\/()&]*[A-Za-z0-9%)]|[A-Za-z0-9]/g;
      if(!re.test(n.data)) return; re.lastIndex=0;
      const f=document.createDocumentFragment(); let last=0,m;
      while((m=re.exec(n.data))){ if(m.index>last) f.append(n.data.slice(last,m.index)); const sp=document.createElement('span'); sp.className='en-up'; sp.textContent=m[0]; f.append(sp); last=m.index+m[0].length; }
      if(last<n.data.length) f.append(n.data.slice(last));
      n.replaceWith(f);
    });
  });
}

// set the Chinese runs in every page title at the smaller title size
function splitTitles(root){
  root.querySelectorAll('main h2, .pmodal h2').forEach(h=>{
    const walker=document.createTreeWalker(h,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('small,.ttl-zh')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{
      const re=/[\u3000-\u303f\u3400-\u9fff\uf900-\ufaff\uff00-\uffef《》「」：、・]+/g;
      if(!re.test(n.data)) return; re.lastIndex=0;
      const f=document.createDocumentFragment(); let last=0,m;
      while((m=re.exec(n.data))){ if(m.index>last) f.append(n.data.slice(last,m.index)); const sp=document.createElement('span'); sp.className='ttl-zh'; sp.textContent=m[0]; f.append(sp); last=m.index+m[0].length; }
      if(last<n.data.length) f.append(n.data.slice(last));
      n.replaceWith(f);
    });
  });
}

function route(){
  const h = (location.hash||'#home').slice(1);
  document.body.classList.remove('is-home','frag-page','betty-page');
  closeProject();
  if(h==='about') viewAbout();
  else if(h==='skills') viewSkills();
  else if(byId[h]) viewDetail(h);
  else if(h.startsWith('cat-') && catById[h.slice(4)]) viewCategory(h.slice(4));
  else viewHome();
  splitTitles(document);
  bumpLatin(document);
  alignFlows(document);
}
document.addEventListener('click',e=>{
  // menu open: a click anywhere outside the menu, the glow or the name closes it
  if(document.body.classList.contains('menu-open') && !e.target.closest('.menu,#blob,#logoBtn')){
    document.body.classList.remove('menu-open'); document.getElementById('logoBtn').setAttribute('aria-expanded','false'); return;
  }
  // project pop-up: close on ×, on the backdrop; switch with ‹ ›
  const pm=document.getElementById('pmodal');
  if(pm){
    if(e.target.closest('[data-close]') || e.target===pm){ e.preventDefault(); return closeProject(); }
    const pp=e.target.closest('[data-popen]'); if(pp){ e.preventDefault(); return openProject(pp.dataset.popen, +(pp.dataset.slide||0)); }
    if(pm.contains(e.target)) return;
  }
  const o=e.target.closest('[data-open]');
  if(o && o.closest('.frag-view')){ e.preventDefault(); return openProject(o.dataset.open); }
  if(o){ e.preventDefault(); return go(o.dataset.open); }
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); return go(g.dataset.go); }
});
const toggleMenu=()=>{const on=document.body.classList.toggle('menu-open');document.getElementById('logoBtn').setAttribute('aria-expanded',String(on));};
document.getElementById('logoBtn').onclick=toggleMenu;
document.getElementById('blob').onclick=toggleMenu;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ document.body.classList.remove('menu-open'); closeProject(); }
  if(document.getElementById('pmodal') && (e.key==='ArrowRight'||e.key==='ArrowLeft')){ e.preventDefault(); stepProject(e.key==='ArrowRight'?1:-1); } });
window.addEventListener('hashchange',route);

/* ===================== OPENING SCREEN ===================== */
// Landing on the works page starts with the menu open (big glow + menu); a click on the glow, the name or a menu item closes it.
if(!location.hash || location.hash==='#home' || location.hash==='#works'){
  document.body.classList.add('menu-open');
  document.getElementById('logoBtn').setAttribute('aria-expanded','true');
}
route();
</script>
